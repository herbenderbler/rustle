# cargo-fuzz targets for the rustle byte parsers. See README.md.
#
# This crate is its own workspace. The empty `[workspace]` at the end keeps it
# out of the main build and CI. It needs nightly Rust.
[package]
name = "rustle-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustle = { path = ".." }

[[bin]]
name = "hci_packet"
path = "fuzz_targets/hci_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ad_structures"
path = "fuzz_targets/ad_structures.rs"
test = false
doc = false
bench = false

[[bin]]
name = "att_pdu"
path = "fuzz_targets/att_pdu.rs"
test = false
doc = false
bench = false

[workspace]
